<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FMA - PDF OCR Tool</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>

  
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #111;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 20px;
    }

    .app { width: 100%; max-width: 850px; }

    /* ---- header ---- */
    .header { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; }
    .header img { height: 50px; }
    .header h1 { font-size: 24px; color: #00c853; }

    .subtitle { color: #888; font-size: 14px; margin-bottom: 28px; }

    /* ---- dropzone ---- */
    .dropzone {
      border: 2px dashed #444;
      border-radius: 12px;
      padding: 50px 20px;
      text-align: center;
      background: #1a1a1a;
      cursor: pointer;
      transition: 0.25s;
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: #00c853;
      background: #1f2e1f;
    }

    .dropzone-icon { font-size: 48px; }
    .dropzone p { color: #aaa; font-size: 15px; margin-top: 8px; }
    .dropzone small { color: #666; font-size: 12px; }

    input[type=file] { display: none; }

    /* ---- buttons ---- */
    .btn-row { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }

    button {
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-primary { background: #00c853; color: #111; }
    .btn-primary:hover { background: #00e676; }
    .btn-primary:disabled { background: #2e4830; color: #555; cursor: not-allowed; }

    .btn-secondary { background: #1565c0; color: #fff; }
    .btn-secondary:hover { background: #1e88e5; }
    .btn-secondary:disabled { background: #1a2a3a; color: #555; cursor: not-allowed; }

    .btn-folder { background: #ff6f00; color: #fff; }
    .btn-folder:hover { background: #ff8f00; }

    /* ---- file list ---- */
    .file-list { margin-top: 24px; }

    .file-card {
      display: flex;
      align-items: center;
      background: #1a1a1a;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 10px;
      border: 1px solid #222;
    }

    .file-icon { font-size: 28px; margin-right: 14px; flex-shrink: 0; }

    .file-info { flex: 1; min-width: 0; }

    .file-name {
      font-weight: 600; font-size: 14px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: #ddd;
    }

    .file-path { color: #555; font-size: 11px; margin-top: 2px; }

    .file-size { color: #666; font-size: 12px; }

    /* ---- progress ---- */
    .progress-wrap {
      height: 6px; background: #333;
      border-radius: 3px; margin-top: 6px; overflow: hidden;
    }

    .progress-bar {
      height: 100%; border-radius: 3px;
      width: 0%; transition: width 0.4s ease;
    }

    .progress-bar.uploading  { background: #42a5f5; width: 30%; }
    .progress-bar.starting   { background: #ffa726; width: 50%; }
    .progress-bar.processing { background: #ffa726; width: 75%; animation: pulse 1.2s infinite; }
    .progress-bar.done       { background: #00c853; width: 100%; }
    .progress-bar.error      { background: #ef5350; width: 100%; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ---- status ---- */
    .file-status {
      margin-left: 14px; flex-shrink: 0;
      font-size: 13px; font-weight: 600;
    }

    .file-status a { color: #00c853; text-decoration: none; }
    .file-status a:hover { text-decoration: underline; }

    .status-uploading  { color: #42a5f5; }
    .status-starting   { color: #ffa726; }
    .status-processing { color: #ffa726; }
    .status-done       { color: #00c853; }
    .status-error      { color: #ef5350; }

    /* ---- summary ---- */
    .summary { margin-top: 16px; font-size: 13px; color: #666; }

    /* ---- footer ---- */
    .footer {
      margin-top: 40px; padding-top: 16px;
      border-top: 1px solid #222;
      text-align: center; font-size: 12px; color: #555;
    }
  </style>
</head>

<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <img src="https://www.nzshareholders.co.nz/wp-content/uploads/2021/10/fma.png" onerror="this.style.display='none'" alt="FMA Logo">
    <h1>PDF OCR Tool</h1>
  </div>

  <p class="subtitle">Upload individual PDFs or select an entire folder to bulk-convert into searchable PDFs</p>

  <!-- Drop zone (individual files) -->
  <div class="dropzone" id="dropzone">
    <div class="dropzone-icon">&#128196;</div>
    <p>Drag & drop PDF files here</p>
    <small>or click to browse individual files</small>
    <input type="file" id="fileInput" multiple accept=".pdf" />
  </div>

  <!-- Hidden folder input -->
  <input type="file" id="folderInput" webkitdirectory directory multiple />

  <!-- Buttons -->
  <div class="btn-row">
    <button class="btn-folder" onclick="document.getElementById('folderInput').click()">Select Folder</button>
    <button class="btn-primary" id="btnProcess" disabled onclick="processAll()">Upload & Convert</button>
    <button class="btn-secondary" id="btnDownloadAll" disabled onclick="downloadAll()">Download All (.zip)</button>
  </div>

  <!-- File list -->
  <div class="file-list" id="fileList"></div>
  <div class="summary" id="summary"></div>

  <!-- Footer -->
  <div class="footer">
    Developed by <strong>Ali Ahmadi</strong> | FMA Technical Operations
  </div>

</div>

<script>
// ============================================================
//  CONFIG
// ============================================================
const BASE = "https://fn-pdfocr-api.azurewebsites.net";

// ============================================================
//  STATE
// ============================================================
let selectedFiles = [];        // { file, relativePath, displayName }
let completedDownloads = [];   // { name, url }

// ============================================================
//  DROP ZONE (individual files)
// ============================================================
const dz  = document.getElementById("dropzone");
const inp = document.getElementById("fileInput");

dz.addEventListener("click", () => inp.click());

["dragenter", "dragover"].forEach(e =>
  dz.addEventListener(e, ev => { ev.preventDefault(); dz.classList.add("dragover"); })
);
["dragleave", "drop"].forEach(e =>
  dz.addEventListener(e, ev => { ev.preventDefault(); dz.classList.remove("dragover"); })
);

dz.addEventListener("drop", ev => {
  const files = [...ev.dataTransfer.files].filter(f => f.name.toLowerCase().endsWith(".pdf"));
  addFiles(files, "");
});

inp.addEventListener("change", () => {
  addFiles([...inp.files], "");
  inp.value = "";
});

// ============================================================
//  FOLDER INPUT
// ============================================================
document.getElementById("folderInput").addEventListener("change", ev => {
  const allFiles = [...ev.target.files];
  const pdfs = allFiles.filter(f => f.name.toLowerCase().endsWith(".pdf"));

  for (const f of pdfs) {
    const path = f.webkitRelativePath || "";
    const alreadyAdded = selectedFiles.find(
      s => s.relativePath === path && s.file.size === f.size
    );

    if (!alreadyAdded) {
      selectedFiles.push({
        file: f,
        relativePath: path,
        displayName: f.name
      });
    }
  }

  renderFileList();
  document.getElementById("btnProcess").disabled = selectedFiles.length === 0;
  ev.target.value = "";
});

// ============================================================
//  ADD FILES (from drag-drop or file picker)
// ============================================================
function addFiles(files, basePath) {
  for (const f of files) {
    const path = basePath ? basePath + "/" + f.name : f.name;
    const alreadyAdded = selectedFiles.find(
      s => s.displayName === f.name && s.file.size === f.size
    );

    if (!alreadyAdded) {
      selectedFiles.push({
        file: f,
        relativePath: path,
        displayName: f.name
      });
    }
  }

  renderFileList();
  document.getElementById("btnProcess").disabled = selectedFiles.length === 0;
}

// ============================================================
//  RENDER FILE LIST
// ============================================================
function renderFileList() {
  const list = document.getElementById("fileList");
  list.innerHTML = "";

  for (const item of selectedFiles) {
    const safe = safeName(item.displayName);

    const card = document.createElement("div");
    card.className = "file-card";
    card.id = "card-" + safe + "-" + item.file.size;

    const pathLabel = item.relativePath && item.relativePath !== item.displayName
      ? `<div class="file-path">${item.relativePath}</div>` : "";

    card.innerHTML = `
      <div class="file-icon">&#128196;</div>
      <div class="file-info">
        <div class="file-name">${item.displayName}</div>
        ${pathLabel}
        <div class="file-size">${(item.file.size / 1024).toFixed(1)} KB</div>
        <div class="progress-wrap">
          <div class="progress-bar" id="bar-${safe}-${item.file.size}"></div>
        </div>
      </div>
      <div class="file-status" id="status-${safe}-${item.file.size}">Ready</div>
    `;

    list.appendChild(card);
  }
}

// ============================================================
//  HELPERS
// ============================================================
function safeName(name) {
  return name.replace(/[^a-zA-Z0-9.\-_]/g, "_");
}

function getCardId(item) {
  return safeName(item.displayName) + "-" + item.file.size;
}

function setStatus(item, phase, html) {
  const id = getCardId(item);
  const bar = document.getElementById("bar-" + id);
  const st  = document.getElementById("status-" + id);
  if (bar) bar.className = "progress-bar " + phase;
  if (st)  { st.className = "file-status status-" + phase; st.innerHTML = html; }
}

function updateSummary() {
  const total = selectedFiles.length;
  const done  = completedDownloads.length;
  document.getElementById("summary").innerText = `${done} / ${total} completed`;
  document.getElementById("btnDownloadAll").disabled = done === 0;
}

// ============================================================
//  PROCESS ALL (concurrent, up to 3)
// ============================================================
async function processAll() {
  document.getElementById("btnProcess").disabled = true;
  completedDownloads = [];
  updateSummary();

  const queue = [...selectedFiles];
  const workers = [];
  const concurrency = 3;

  for (let i = 0; i < Math.min(concurrency, queue.length); i++) {
    workers.push(runWorker(queue));
  }

  await Promise.all(workers);
  document.getElementById("btnProcess").disabled = false;
}

async function runWorker(queue) {
  while (queue.length > 0) {
    const item = queue.shift();
    await processOne(item);
  }
}

async function processOne(item) {
  const safe = safeName(item.displayName);

  try {
    // 1. Get SAS URL
    setStatus(item, "uploading", "Uploading...");
    const sasResp = await fetch(`${BASE}/api/upload?filename=${encodeURIComponent(safe)}`);
    if (!sasResp.ok) throw new Error("SAS failed");
    const sas = await sasResp.text();

    // 2. Upload file
    const upResp = await fetch(sas, {
      method: "PUT",
      headers: { "x-ms-blob-type": "BlockBlob" },
      body: item.file
    });
    if (!upResp.ok) throw new Error("Upload failed");

    // 3. Start OCR
    setStatus(item, "starting", "Starting OCR...");
    const ocrResp = await fetch(`${BASE}/api/start-ocr`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ blob_url: sas, filename: safe })
    });
    if (!ocrResp.ok) throw new Error("OCR start failed");
    const op = await ocrResp.text();

    // 4. Poll for result
    setStatus(item, "processing", "Processing...");
    let downloadUrl = null;

    while (!downloadUrl) {
      await new Promise(r => setTimeout(r, 2500));
      const pollResp = await fetch(
        `${BASE}/api/get-ocr-pdf?op=${encodeURIComponent(op)}&filename=${encodeURIComponent(safe)}`
      );
      const text = await pollResp.text();
      if (text.startsWith("http")) {
        downloadUrl = text;
      }
    }

    // 5. Done — preserve folder structure in output name
    const outName = safe.replace(/\.pdf$/i, "") + "_ocr.pdf";

    // Build output path (preserving folder structure)
    let outputPath = outName;
    if (item.relativePath && item.relativePath.includes("/")) {
      const folder = item.relativePath.substring(0, item.relativePath.lastIndexOf("/"));
      outputPath = folder + "/" + outName;
    }

    completedDownloads.push({ name: outputPath, url: downloadUrl });
    setStatus(item, "done", `<a href="${downloadUrl}" target="_blank">Download</a>`);

  } catch (err) {
    console.error(item.displayName, err);
    setStatus(item, "error", "Error");
  }

  updateSummary();
}

// ============================================================
//  DOWNLOAD ALL AS ZIP (preserves folder structure)
// ============================================================
async function downloadAll() {
  if (completedDownloads.length === 0) return;

  document.getElementById("btnDownloadAll").disabled = true;
  document.getElementById("btnDownloadAll").innerText = "Zipping...";

  try {
    const zip = new JSZip();

    for (const item of completedDownloads) {
      const resp = await fetch(item.url);
      const blob = await resp.blob();

      // Folder structure preserved inside ZIP
      zip.file(item.name, blob);
    }

    const content = await zip.generateAsync({ type: "blob" });
    saveAs(content, "ocr_results.zip");

  } catch (err) {
    console.error("ZIP error:", err);
    alert("Failed to create ZIP. You can still download files individually.");
  }

  document.getElementById("btnDownloadAll").disabled = false;
  document.getElementById("btnDownloadAll").innerText = "Download All (.zip)";
}
</script>

</body>
</html>
