<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signing in...</title>
  <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
</head>
<body>
<p>Completing sign-in. You can close this window if it does not close automatically.</p>
<script>
  // Sign-in return page. It completes the sign-in using the same settings as index.html, then sends the user to the app.
  const msalApp = new msal.PublicClientApplication({
    auth: {
      clientId: "8c9e2fe0-3dca-4425-b58d-a97e76dbb36e",
      authority: "https://login.microsoftonline.com/bd831b0c-3781-40ec-801e-5dfba266decf",
      redirectUri: window.location.origin + "/redirect.html"
    },
    cache: { cacheLocation: "localStorage", storeAuthStateInCookie: true }
  });
  msalApp.initialize()
    .then(() => msalApp.handleRedirectPromise())
    .then((response) => {
      if (response) msalApp.setActiveAccount(response.account);
      window.location.replace("/");
    })
    .catch((err) => {
      document.body.textContent = "Sign-in failed: " + (err && (err.errorCode || err.errorMessage) ? (err.errorCode || err.errorMessage) : err);
    });
</script>
</body>
</html>
